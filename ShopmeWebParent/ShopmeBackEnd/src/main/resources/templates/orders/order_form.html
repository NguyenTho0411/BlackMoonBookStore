<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: page_head(${pageTitle}, 'none')" />

<body style="background-color: #f9f5ff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
<div class="container-fluid p-0">
    <div th:replace="navigation :: menu"></div>

    <!-- Page Header with Modern Styling -->
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0" style="color: #512DA8; font-weight: 600;">
                <i class="fas fa-shopping-bag me-2"></i>Manage Orders | [[${pageTitle}]]
            </h2>
        </div>

        <form th:action="@{/order/save}" th:object="${order}" method="post"
              onsubmit="return processFormBeforeSubmit();"
              class="card border-0 shadow-sm" style="border-radius: 12px; overflow: hidden;">
            <input type="hidden" th:field="*{id}" />
            
            <!-- Enhanced Tab Navigation -->
            <div class="card-header border-0 p-0">
                <ul class="nav nav-tabs border-0" id="myTab" role="tablist">
                    <li class="nav-item">
                        <a class="nav-link active" id="overview-tab" data-bs-toggle="tab" href="#overview" role="tab"
                           style="padding: 16px 20px; color: #512DA8; font-weight: 500; border-bottom: 2px solid transparent;">
                           <i class="fas fa-info-circle me-2"></i>Overview
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="products-tab" data-bs-toggle="tab" href="#books" role="tab"
                           style="padding: 16px 20px; color: #512DA8; font-weight: 500; border-bottom: 2px solid transparent;">
                           <i class="fas fa-book me-2"></i>Books
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="shipping-tab" data-bs-toggle="tab" href="#shipping" role="tab"
                           style="padding: 16px 20px; color: #512DA8; font-weight: 500; border-bottom: 2px solid transparent;">
                           <i class="fas fa-shipping-fast me-2"></i>Shipping
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="track-tab" data-bs-toggle="tab" href="#track" role="tab"
                           style="padding: 16px 20px; color: #512DA8; font-weight: 500; border-bottom: 2px solid transparent;">
                           <i class="fas fa-map-marker-alt me-2"></i>Track
                        </a>
                    </li>
                </ul>
            </div>
            
            <div class="card-body">
                <div class="tab-content" id="myTabContent">
                    <div class="tab-pane fade show active p-3" id="overview" role="tabpanel">
                        <div th:replace="orders/order_form_overview :: content"></div>
                    </div>

                    <div class="tab-pane fade p-3" id="books" role="tabpanel">
                        <div th:replace="orders/order_form_books :: content"></div>
                    </div>

                    <div class="tab-pane fade p-3" id="shipping" role="tabpanel">
                        <div th:replace="orders/order_form_shipping :: content"></div>
                    </div>

                    <div class="tab-pane fade p-3" id="track" role="tabpanel">
                        <div th:replace="orders/order_form_tracks:: content"></div>
                    </div>
                </div>
            </div>
            
            <div class="card-footer bg-white text-center p-3 border-0">
                <button type="submit" class="btn btn-primary me-2 px-4"
                        style="background: linear-gradient(135deg, #6C3483 0%, #512DA8 100%); border: none; padding: 10px 20px;">
                    <i class="fas fa-save me-2"></i>Save
                </button>
                <button type="button" id="buttonCancel" class="btn btn-outline-secondary px-4"
                        style="border-color: #e0d0ff; color: #512DA8; padding: 10px 20px;">
                    <i class="fas fa-times me-2"></i>Cancel
                </button>
            </div>
        </form>
    </div>

    <div th:replace="modal_fragments :: modal_dialog"></div>
    <div th:replace="orders/add_product_modal :: content"></div>

    <div th:replace="fragments2 :: footer"></div>
</div>

<script type="text/javascript">
    contextPath = "[[@{/}]]";
    var csrfHeaderName = "[[${_csrf.headerName}]]";
    var csrfValue = "[[${_csrf.token}]]";

    $(document).ready(function() {
        $('#buttonCancel').click(function() {
            window.location = "[[@{/orders}]]";
        });
        
        // Add active class to current tab based on URL hash or default to overview
        const hash = window.location.hash || '#overview';
        $(`a[href="${hash}"]`).tab('show');
        
        // Add hover effects for buttons
        $('.btn').hover(
            function() {
                $(this).css('transform', 'translateY(-3px)');
                $(this).css('box-shadow', '0 4px 8px rgba(0,0,0,0.15)');
            },
            function() {
                $(this).css('transform', 'translateY(0)');
                $(this).css('box-shadow', 'none');
            }
        );
        
        // Add active class to tab on click
        $('.nav-link').on('click', function() {
            $('.nav-link').css('border-bottom', '2px solid transparent');
            $(this).css('border-bottom', '2px solid #512DA8');
        });
        
        // Set active tab border
        $('.nav-link.active').css('border-bottom', '2px solid #512DA8');
    });

    function showModalDialog(title, message) {
        document.getElementById("modalTitle").textContent = title;
        document.getElementById("modalBody").textContent = message;

        const modal = new bootstrap.Modal(document.getElementById('modalDialog'), {});
        modal.show();
    }

    function showWarningModal(message) {
        showModalDialog("Warning", message);
    }

    function showErrorModal(message) {
        showModalDialog("Error", message);
    }
</script>
<script th:src="@{/js/common_form_country_state.js}"></script>
<script th:src="@{/js/jquery.number.min.js}"></script>
<script th:src="@{/js/order_form_overview_products.js}"></script>
<script th:src="@{/js/order_form_add_product.js}"></script>
<script th:src="@{/js/order_form_remove_product.js}"></script>
<script th:src="@{/js/order_form_tracks.js}"></script>

<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f9f5ff;
    }
    
    /* Button styles */
    .btn {
        transition: all 0.3s ease;
        border-radius: 6px;
        font-weight: 500;
    }
    
    .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }
    
    /* Tab navigation styling */
    .nav-tabs {
        border-bottom: 1px solid #e0d0ff;
    }
    
    .nav-tabs .nav-link {
        transition: all 0.3s ease;
        border: none;
    }
    
    .nav-tabs .nav-link:hover {
        background-color: #f8f0ff;
        border-bottom: 2px solid #e0d0ff;
    }
    
    .nav-tabs .nav-link.active {
        color: #512DA8;
        font-weight: 600;
        background-color: #fff;
    }
    
    /* Form controls */
    .form-control {
        border-color: #e0d0ff;
        border-radius: 6px;
        transition: all 0.3s ease;
    }
    
    .form-control:focus {
        border-color: #6C3483;
        box-shadow: 0 0 0 0.2rem rgba(108, 52, 131, 0.15);
    }
    
    /* Labels */
    .col-form-label {
        color: #512DA8;
        font-weight: 500;
    }
    
    /* Card styles */
    .card {
        transition: all 0.3s ease;
    }
</style>
</body>
</html>
