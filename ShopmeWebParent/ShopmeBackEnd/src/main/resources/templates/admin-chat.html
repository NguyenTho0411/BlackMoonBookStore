<!DOCTYPE html>
<html>
<head>
    <title>Admin Chat</title>
    <script src="https://cdn.jsdelivr.net/sockjs/1.0.2/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .chat-container {
            max-width: 900px;
            margin: 50px auto;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.2);
            padding: 20px;
        }
        .message {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .message.admin {
            background-color: #d1e7dd;
            text-align: right;
        }
        .message.customer {
            background-color: #f8d7da;
            text-align: left;
        }
        .message strong {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
    <script src="/js/admin-chat.js"></script>
</head>
<body>
    <div class="chat-container">
        <h2>Admin Chat</h2>
        <div id="messages" style="height: 400px; overflow-y: auto;"></div>
        <input type="text" id="sender" placeholder="Enter your name" class="form-control mb-2">
        <input type="text" id="receiver" placeholder="Enter receiver's name" class="form-control mb-2">
        <input type="text" id="content" placeholder="Enter your message" class="form-control mb-2">
        <button class="btn btn-primary" onclick="sendMessage()">Send</button>
    </div>
</body>
</html>
