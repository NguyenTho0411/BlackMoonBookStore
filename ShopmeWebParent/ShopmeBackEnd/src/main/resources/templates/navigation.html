<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="https://www.thymeleaf.org/thymleaf-extras-springsecurity5">

<body>
    <div th:fragment="menu">
        <form th:action="@{/logout}" method="post" th:hidden="true"
            name="logoutForm">
            <input type="submit">
        </form>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container-fluid px-4">
        <div class="d-flex align-items-center justify-content-between w-100">
            <!-- Logo -->
            <a class="navbar-brand" th:href="@{/}">
                <img th:src="@{/images/blackmoonsmall.png}" alt="Blackmoon Books" class="logo-img" />
            </a>
            
            <!-- Toggle button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                data-bs-target="#topNavbar" aria-controls="topNavbar" 
                aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu chính ở giữa -->
            <div class="collapse navbar-collapse justify-content-center" id="topNavbar">
                <ul class="navbar-nav main-menu">
                    <li class="nav-item" sec:authorize="hasAuthority('Admin')">
                        <a class="nav-link" th:href="@{/users}"><i class="fas fa-users"></i> Users</a>
                    </li>
                    <th:block sec:authorize="hasAnyAuthority('Admin','Assistant')">
                        <li class="nav-item"><a class="nav-link" th:href="@{/categories}"><i class="fas fa-folder"></i> Categories</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/publishers}"><i class="fas fa-tags"></i> Publishers</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/customers}"><i class="fas fa-user-friends"></i> Customers</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/books}"><i class="fas fa-user-friends"></i> Books</a></li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="managementDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fas fa-tasks"></i> Management
                            </a>
                            <ul class="dropdown-menu" aria-labelledby="managementDropdown">
                                <li><a class="dropdown-item" th:href="@{/shipping_rates}"><i class="fas fa-shipping-fast"></i> Shipping</a></li>
                                <li><a class="dropdown-item" th:href="@{/questions}"><i class="fas fa-question-circle"></i> Questions</a></li>
                                <li><a class="dropdown-item" th:href="@{/reviews}"><i class="fas fa-star"></i> Reviews</a></li>
                                <li><a class="dropdown-item" th:href="@{/promotions}"><i class="fas fa-percentage"></i> Promotions</a></li>
								<li><a class="dropdown-item" th:href="@{/chats}"><i class="fas fa-percentage"></i> Chat</a></li>
                            </ul>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="contentDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fas fa-file-alt"></i> Content
                            </a>
                            <ul class="dropdown-menu" aria-labelledby="contentDropdown">
                                <li><a class="dropdown-item" th:href="@{/articles}"><i class="fas fa-newspaper"></i> Articles</a></li>
                                <li><a class="dropdown-item" th:href="@{/menus}"><i class="fas fa-bars"></i> Menus</a></li>
                            </ul>
                        </li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/reports}"><i class="fas fa-chart-bar"></i> Reports</a></li>
                    </th:block>
                    <th:block sec:authorize="hasAnyAuthority('Admin','Salesperson','Assistant')">
                        <li class="nav-item"><a class="nav-link" th:href="@{/orders}"><i class="fas fa-shopping-bag"></i> Orders</a></li>
                    </th:block>
                    <li class="nav-item" sec:authorize="hasAuthority('Admin')">
                        <a class="nav-link" th:href="@{/settings}"><i class="fas fa-cog"></i> Settings</a>
                    </li>
                </ul>
            </div>

            <!-- Avatar bên phải -->
            <div class="user-profile">
                <ul class="navbar-nav">
                    <li class="nav-item dropdown user-dropdown">
                        <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown" data-bs-toggle="dropdown" role="button" aria-expanded="false">
                            <div class="avatar-circle">
                                <span class="initials" sec:authentication="principal.initial"></span>
                            </div>
                            <span sec:authentication="principal.fullname" class="user-name d-none d-lg-inline"></span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end fade-down user-menu" aria-labelledby="userDropdown">
                            <li class="user-header">
                                <div class="avatar-circle-large">
                                    <span class="initials-large" sec:authentication="principal.initial"></span>
                                </div>
                                <p class="mb-0 fw-bold" sec:authentication="principal.fullname">Nguyen</p>
                                <small sec:authentication="principal.authorities">Admin</small>
                            </li>
                            <div class="dropdown-divider"></div>
                            <li><a class="dropdown-item" th:href="@{/account}"><i class="fas fa-user-cog"></i> Tài khoản</a></li>
                            <div class="dropdown-divider"></div>
                            <li><a class="dropdown-item logout-link" id="logoutLink" th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>


        <!-- CSS để làm đẹp navigation -->
        <style>
/* Gradient background và các biến CSS */
:root {
    --primary-color: #6C3483;
    --secondary-color: #512DA8;
    --accent-color: #FEC3A6;
    --hover-color: rgba(255, 255, 255, 0.15);
    --text-color: #fff;
    --dropdown-bg: #fff;
    --dropdown-text: #333;
    --dropdown-hover: #f0e6ff;
}

/* Navbar styling */
.navbar {
    background: linear-gradient(135deg, var(--primary-color) 0%,
        var(--secondary-color) 100%);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    padding: 0.75rem 0;
    transition: all 0.3s ease;
}

.navbar.scrolled {
    padding: 0.5rem 0;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
}

/* Logo styling */
.logo-img {
    height: 45px;
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
}

.navbar-brand {
    padding: 0.5rem 0;
    margin-right: 1.5rem;
}

.navbar-brand:hover .logo-img {
    transform: scale(1.08) rotate(-2deg);
}

/* Main menu styling */
.main-menu {
    display: flex;
    gap: 0.25rem;
}

.main-menu .nav-item {
    position: relative;
}

.main-menu .nav-link {
    display: flex;
    align-items: center;
    padding: 0.75rem 1rem;
    margin: 0 0.125rem;
    color: var(--text-color);
    border-radius: 8px;
    transition: all 0.3s ease;
    font-weight: 500;
    letter-spacing: 0.2px;
}

.main-menu .nav-link i {
    font-size: 16px;
    margin-right: 8px;
    transition: transform 0.3s ease;
}

.main-menu .nav-link:hover {
    background-color: var(--hover-color);
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

.main-menu .nav-link:hover i {
    transform: scale(1.2);
}

.main-menu .nav-link.active {
    background-color: var(--hover-color);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
}

/* Dropdown menus */
.dropdown-menu {
    border: none;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    overflow: hidden;
    animation: dropdownFade 0.3s ease;
    min-width: 220px;
    margin-top: 10px;
    padding: 0;
}

.dropdown-menu::before {
    content: '';
    position: absolute;
    top: -5px;
    left: 20px;
    width: 10px;
    height: 10px;
    background: #fff;
    transform: rotate(45deg);
    z-index: -1;
}

.dropdown-item {
    padding: 12px 20px;
    color: var(--dropdown-text);
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
}

.dropdown-item i {
    margin-right: 10px;
    font-size: 16px;
    transition: all 0.2s ease;
    width: 20px;
    text-align: center;
}

.dropdown-item:hover {
    background-color: var(--dropdown-hover);
    transform: translateX(5px);
    color: var(--primary-color);
}

.dropdown-item:hover i {
    transform: scale(1.2);
    color: var(--primary-color);
}

.dropdown-divider {
    margin: 0;
    opacity: 0.1;
}

/* User dropdown specific styling */
.user-profile {
    margin-left: auto;
}

.user-dropdown .dropdown-toggle::after {
    display: none;
}

.avatar-circle {
    width: 38px;
    height: 38px;
    background-color: var(--accent-color);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 10px;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.3);
    transition: all 0.3s ease;
}

.user-dropdown:hover .avatar-circle {
    transform: scale(1.1);
}

.initials {
    font-size: 16px;
    font-weight: bold;
    color: #333;
}

.user-name {
    font-weight: 500;
    max-width: 120px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.user-menu {
    right: 0 !important;
    left: auto !important;
    min-width: 280px;
}

.user-menu::before {
    right: 20px;
    left: auto;
}

.user-header {
    padding: 20px;
    text-align: center;
    background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf5 100%);
}

.avatar-circle-large {
    width: 70px;
    height: 70px;
    background-color: var(--accent-color);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    border: 3px solid #fff;
}

.initials-large {
    font-size: 32px;
    font-weight: bold;
    color: #333;
}

.logout-link {
    color: #e74c3c;
}

.logout-link:hover {
    background-color: #fff5f5;
    color: #c0392b;
}

/* Animations */
@keyframes dropdownFade {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Mobile responsive adjustments */
@media (max-width: 992px) {
    .navbar {
        padding: 0.5rem 1rem;
    }
    
    .navbar-collapse {
        background: linear-gradient(135deg, var(--primary-color) 0%,
            var(--secondary-color) 100%);
        border-radius: 12px;
        padding: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        max-height: 80vh;
        overflow-y: auto;
        margin-top: 10px;
    }
    
    .main-menu {
        gap: 5px;
        margin-bottom: 15px;
    }
    
    .main-menu .nav-link {
        border-radius: 8px;
        padding: 12px 15px;
    }
    
    .dropdown-menu {
        background-color: rgba(255, 255, 255, 0.1);
        box-shadow: none;
        border-radius: 8px;
        margin-top: 5px;
        margin-bottom: 10px;
        padding: 5px;
    }
    
    .dropdown-menu::before {
        display: none;
    }
    
    .dropdown-item {
        color: #fff;
        border-radius: 6px;
    }
    
    .dropdown-item:hover {
        background-color: rgba(255, 255, 255, 0.15);
        color: #fff;
    }
    
    .dropdown-divider {
        background-color: rgba(255, 255, 255, 0.1);
    }
    
    .user-header {
        background: transparent;
    }
    
    .user-name {
        max-width: none;
    }
    
    .user-profile {
        margin-left: 0;
        margin-top: 1rem;
    }
}

document.addEventListener("DOMContentLoaded", function () {

    // Sticky navbar on scroll
    window.addEventListener("scroll", function () {
        const navbar = document.querySelector(".navbar");
        if (window.scrollY > 50) {
            navbar.classList.add("scrolled");
        } else {
            navbar.classList.remove("scrolled");
        }
    });


    const currentLocation = window.location.pathname;
    const navLinks = document.querySelectorAll(".nav-link");

    navLinks.forEach(link => {
        const linkPath = link.getAttribute("href");
        if (linkPath && currentLocation.includes(linkPath) && linkPath !== "/") {
            link.classList.add("active");
        }
    });

    // Handle logout with confirmation
    const logoutLink = document.getElementById("logoutLink");
    if (logoutLink) {
        logoutLink.addEventListener("click", function (e) {
            e.preventDefault();
            if (confirm("Bạn có chắc chắn muốn đăng xuất?")) {
                document.forms["logoutForm"].submit();
            }
        });
    }

});

</style>
    </div>
</body>
</html>
