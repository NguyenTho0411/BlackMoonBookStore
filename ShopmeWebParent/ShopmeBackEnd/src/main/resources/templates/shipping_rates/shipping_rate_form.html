<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: page_head(${pageTitle}, 'none')"></head>

<body>
    <div class="container-fluid">
        <div th:replace="navigation :: menu"></div>
        
        <!-- Main Content Container with improved spacing and styling -->
        <div class="container py-4">
            <!-- Page Header with Blackmoon Style -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0" style="color: #512DA8; font-weight: 600;">
                    <i class="fas fa-shipping-fast me-2"></i>[[${pageTitle}]]
                </h2>
                
                <a th:href="@{/shipping_rates}" class="btn btn-outline-secondary" 
                   style="border-radius: 8px; transition: all 0.3s ease;">
                    <i class="fas fa-arrow-left me-2"></i>Back to Shipping Rates
                </a>
            </div>
            
            <!-- Form Card with better styling -->
            <div class="card mb-4" style="border-radius: 12px; border: none; box-shadow: 0 5px 20px rgba(0,0,0,0.1);">
                <div class="card-header py-3" style="background: linear-gradient(135deg, #6C3483 0%, #512DA8 100%); color: white; border-top-left-radius: 12px; border-top-right-radius: 12px;">
                    <h5 class="mb-0">
                        <i class="fas fa-edit me-2"></i>Shipping Rate Details
                    </h5>
                </div>
                
                <div class="card-body p-4">
                    <form th:action="@{/shipping_rates/save}" th:object="${rate}" method="post">
                        <input type="hidden" th:field="*{id}" />
                        
                        <!-- Country Selection with improved styling -->
                        <div class="form-group row mb-4">
                            <label for="country" class="col-sm-4 col-form-label fw-bold">
                                <i class="fas fa-globe-americas me-2" style="color: #512DA8;"></i>Destination Country:
                            </label>
                            <div class="col-sm-8">
                                <select th:field="*{country}" class="form-select" style="border-color: #e0d0ff; border-radius: 8px;">
                                    <option th:each="country : ${listCountries}" th:value="${country.id}">
                                        [[${country.name}]]
                                    </option>
                                </select>
                            </div>
                        </div>
                        
                        <!-- State Field with improved styling -->
                        <div class="form-group row mb-4">
                            <label for="state" class="col-sm-4 col-form-label fw-bold">
                                <i class="fas fa-map-marker-alt me-2" style="color: #512DA8;"></i>Destination State/Province:
                            </label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control" th:field="*{state}" 
                                       minlength="3" maxlength="64" list="listStates" required
                                       style="border-color: #e0d0ff; border-radius: 8px; padding: 10px 15px;">
                                <datalist id="listStates"></datalist>
                                <small class="text-muted">Enter the state or province name</small>
                            </div>
                        </div>
                        
                        <!-- Rate Field with improved styling -->
                        <div class="form-group row mb-4">
                            <label for="rate" class="col-sm-4 col-form-label fw-bold">
                                <i class="fas fa-money-bill-wave me-2" style="color: #512DA8;"></i>Shipping Rate:
                            </label>
                            <div class="col-sm-8">
                                <div class="input-group">
                                    <span class="input-group-text" style="background-color: #f8f0ff; border-color: #e0d0ff;">
                                        <i class="fas fa-dollar-sign"></i>
                                    </span>
                                    <input type="number" class="form-control" th:field="*{rate}" 
                                           required step="0.01" min="0"
                                           style="border-color: #e0d0ff; border-radius: 0 8px 8px 0; padding: 10px 15px;">
                                </div>
                                <small class="text-muted">Price per DIM weight</small>
                            </div>
                        </div>
                        
                        <!-- Days Field with improved styling -->
                        <div class="form-group row mb-4">
                            <label for="days" class="col-sm-4 col-form-label fw-bold">
                                <i class="far fa-clock me-2" style="color: #512DA8;"></i>Days to Deliver:
                            </label>
                            <div class="col-sm-8">
                                <div class="input-group">
                                    <span class="input-group-text" style="background-color: #f8f0ff; border-color: #e0d0ff;">
                                        <i class="fas fa-calendar-day"></i>
                                    </span>
                                    <input type="number" class="form-control" th:field="*{days}" 
                                           required step="1" min="0"
                                           style="border-color: #e0d0ff; border-radius: 0 8px 8px 0; padding: 10px 15px;">
                                </div>
                                <small class="text-muted">Estimated delivery time in days</small>
                            </div>
                        </div>
                        
                        <!-- COD Option with toggle switch -->
                        <div class="form-group row mb-4">
                            <label class="col-sm-4 col-form-label fw-bold">
                                <i class="fas fa-hand-holding-usd me-2" style="color: #512DA8;"></i>Cash On Delivery (COD):
                            </label>
                            <div class="col-sm-8 d-flex align-items-center">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" th:field="*{codSupported}" 
                                           style="width: 3em; height: 1.5em;">
                                    <label class="form-check-label ms-2" for="codSupported">
                                        <span th:if="*{codSupported}" class="text-success">Enabled</span>
                                        <span th:unless="*{codSupported}" class="text-secondary">Disabled</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Form Actions -->
                        <div class="text-center mt-4 pt-3 border-top">
                            <button type="submit" class="btn btn-primary me-3 px-4" 
                                    style="background: linear-gradient(135deg, #6C3483 0%, #512DA8 100%); border: none; border-radius: 8px; padding: 10px 24px; transition: all 0.3s ease;">
                                <i class="fas fa-save me-2"></i>Save Changes
                            </button>
                            <button type="button" id="buttonCancel" class="btn btn-outline-secondary px-4" 
                                    style="border-radius: 8px; padding: 10px 24px; transition: all 0.3s ease;">
                                <i class="fas fa-times me-2"></i>Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <div th:replace="modal_fragments :: modal_dialog"></div>
        <div th:replace="fragments :: footer"></div>
    </div>
    
    <script type="text/javascript">
        contextPath = "[[@{/}]]";
        moduleURL = "[[@{/shipping_rates}]]";
        
        $(document).ready(function() {
            // Toggle text for COD switch
            $('input[type="checkbox"]').change(function() {
                if($(this).is(":checked")) {
                    $(this).next().html('<span class="text-success">Enabled</span>');
                } else {
                    $(this).next().html('<span class="text-secondary">Disabled</span>');
                }
            });
            
            // Add hover effects
            $('.btn').hover(
                function() { $(this).css('transform', 'translateY(-2px)').css('box-shadow', '0 5px 15px rgba(0,0,0,0.1)'); },
                function() { $(this).css('transform', 'translateY(0)').css('box-shadow', 'none'); }
            );
        });
    </script>
    <script th:src="@{/js/common_form.js}"></script>
    <script th:src="@{/js/common_form_country_state.js}"></script>
    
    <!-- Add additional styling -->
    <style>
        body {
            background-color: #f9f7ff;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: #6C3483;
            box-shadow: 0 0 0 0.25rem rgba(108, 52, 131, 0.25);
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .card {
            animation: fadeIn 0.6s ease-out;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #7D3C98 0%, #5E35B1 100%) !important;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2) !important;
        }
        
        /* Input focus animation */
        .form-control, .form-select {
            transition: all 0.3s ease;
        }
        
        .form-control:focus, .form-select:focus {
            transform: translateY(-2px);
        }
        
        /* Custom form-check-input styling */
        .form-check-input {
            cursor: pointer;
            background-color: #f8f0ff;
            border-color: #e0d0ff;
        }
        
        .form-check-input:checked {
            background-color: #512DA8;
            border-color: #512DA8;
        }
    </style>
</body>
</html>
