<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: page_head('Promotions - Blackmoon Admin', 'none')"></head>
<body>
<div class="container-fluid">
    <div th:replace="navigation :: menu"></div>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0" style="color: #512DA8; font-weight: 600;">
                <i class="fas fa-tags me-2"></i>Manage Promotions
            </h2>
            <a th:href="@{/promotions/new}" class="btn btn-sm"
               style="background: linear-gradient(135deg, #6C3483 0%, #512DA8 100%); color: white; border-radius: 6px;">
                <i class="fas fa-plus-circle me-1"></i> Create New Promotion
            </a>
        </div>

        <div th:if="${message != null}" class="alert alert-success text-center">
            <i class="fas fa-check-circle me-2"></i>[[${message}]]
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead style="background: linear-gradient(135deg, #6C3483 0%, #512DA8 100%); color: white;">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Discount</th>
                            <th>Start - End</th>
                            <th>Categories</th>
                            <th>Status</th>
                            <th class="text-center">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="promotion : ${listPromotions}">
                            <td>[[${promotion.id}]]</td>
                            <td>[[${promotion.name}]]</td>
                            <td>[[${promotion.discountPercent}]]%</td>
                            <td>
                                <span th:text="${#dates.format(promotion.startDate, 'yyyy-MM-dd')}"></span> to
                                <span th:text="${#dates.format(promotion.endDate, 'yyyy-MM-dd')}"></span>
                            </td>
                            <td>
                                <span th:each="cat : ${promotion.categories}"
                                      class="badge bg-secondary me-1"
                                      th:text="${cat.name}"></span>
                            </td>
                            <td>
                                <span th:if="${promotion.enabled}" class="text-success fw-bold">Enabled</span>
                                <span th:if="${!promotion.enabled}" class="text-danger fw-bold">Disabled</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{'/promotions/edit/' + ${promotion.id}}"
                                   class="btn btn-sm btn-outline-primary me-1" title="Edit">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a th:href="@{'/promotions/delete/' + ${promotion.id}}"
                                   class="btn btn-sm btn-outline-danger link-delete" title="Delete">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="modal_fragments :: confirm_modal"></div>
<div th:replace="fragments :: footer"></div>

<script th:src="@{/js/common_list.js}"></script>
<script type="text/javascript">
    $(document).ready(function () {
        $(".link-delete").on("click", function (e) {
            e.preventDefault();
            const link = $(this);
            const href = link.attr("href");
            $("#yesButton").attr("href", href);
            $("#confirmText").text("Are you sure you want to delete this promotion?");
            new bootstrap.Modal(document.getElementById('confirmModal')).show();
        });
    });
</script>
</body>
</html>
