<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: page_head(${pageTitle}, 'none')">
</head>

<body>
    <div class="container-fluid">
        <div th:replace="navigation :: menu"></div>

        <div class="text-center my-4">
            <h2 class="fw-bold" style="color: #512DA8;">
                <i class="fas fa-tags me-2"></i>Manage Promotion | [[${pageTitle}]]
            </h2>
            <hr class="mx-auto" style="width: 50%; border-color: #6C3483; opacity: 0.5;">
        </div>

        <form th:action="@{/promotions/save}" method="post"
            style="max-width: 700px; margin: 0 auto"
            th:object="${promotion}">
            <input type="hidden" th:field="*{id}" />

            <div class="border rounded p-4 bg-white shadow-sm" style="border-radius: 12px;">

                <!-- Promotion Name -->
                <div class="form-group row mb-3">
                    <label class="col-sm-4 col-form-label fw-medium" style="color: #512DA8;">
                        <i class="fas fa-pen me-2"></i>Promotion Name:
                    </label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control" th:field="*{name}"
                            required minlength="3" maxlength="128"
                            style="border-radius: 8px;" />
                    </div>
                </div>

                <!-- Discount Percent -->
                <div class="form-group row mb-3">
                    <label class="col-sm-4 col-form-label fw-medium" style="color: #512DA8;">
                        <i class="fas fa-percentage me-2"></i>Discount Percent:
                    </label>
                    <div class="col-sm-8">
                        <input type="number" class="form-control" th:field="*{discountPercent}" min="1" max="100"
                            required style="border-radius: 8px;" />
                    </div>
                </div>

                <!-- Start Date -->
                <div class="form-group row mb-3">
                    <label class="col-sm-4 col-form-label fw-medium" style="color: #512DA8;">
                        <i class="fas fa-calendar-alt me-2"></i>Start Date:
                    </label>
                    <div class="col-sm-8">
                        <input type="date" class="form-control" th:field="*{startDate}" required
                            style="border-radius: 8px;" />
                    </div>
                </div>

                <!-- End Date -->
                <div class="form-group row mb-3">
                    <label class="col-sm-4 col-form-label fw-medium" style="color: #512DA8;">
                        <i class="fas fa-calendar-check me-2"></i>End Date:
                    </label>
                    <div class="col-sm-8">
                        <input type="date" class="form-control" th:field="*{endDate}" required
                            style="border-radius: 8px;" />
                    </div>
                </div>

                <!-- Status -->
                <div class="form-group row mb-3">
                    <label class="col-sm-4 col-form-label fw-medium" style="color: #512DA8;">
                        <i class="fas fa-toggle-on me-2"></i>Enabled:
                    </label>
                    <div class="col-sm-8 d-flex align-items-center">
                        <input type="checkbox" th:field="*{enabled}" class="form-check-input me-2" />
                        <label class="form-check-label">Active</label>
                    </div>
                </div>

                <!-- Chọn Categories -->
                <div class="form-group row mb-3">
                    <label class="col-sm-4 col-form-label fw-medium" style="color: #512DA8;">
                        <i class="fas fa-list-alt me-2"></i>Select Categories:
                    </label>
                    <div class="col-sm-8">
                        <select id="categories" class="form-control"
                            th:field="*{categories}" multiple required
                            style="resize: vertical; height: 200px; border-radius: 8px;">
                            <th:block th:each="cat : ${listCategories}">
                                <option th:value="${cat.id}" th:text="${cat.name}"></option>
                            </th:block>
                        </select>
                    </div>
                </div>

                <!-- Hiển thị categories đã chọn -->
                <div class="form-group row mb-4">
                    <label class="col-sm-4 col-form-label fw-medium" style="color: #512DA8;">
                        <i class="fas fa-tags me-2"></i>Chosen Categories:
                    </label>
                    <div class="col-sm-8">
                        <div id="chosenCategories"></div>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="text-center">
                    <input type="submit" value="Save" class="btn btn-primary px-4 me-2" />
                    <a th:href="@{/promotions}" class="btn btn-secondary px-4">Cancel</a>
                </div>
            </div>
        </form>

        <div th:replace="modal_fragments :: modal_dialog"></div>
        <div th:replace="fragments :: footer"></div>
    </div>

    <script>
        $(document).ready(function () {
            const dropdown = $("#categories");
            const displayDiv = $("#chosenCategories");

            dropdown.change(function () {
                displayDiv.empty();
                updateChosen();
            });

            function updateChosen() {
                dropdown.find("option:selected").each(function () {
                    const text = $(this).text().replace(/-/g, "");
                    displayDiv.append(`<span class='badge bg-secondary m-1 p-2' style='font-size: 0.9rem'>${text}</span>`);
                });
            }

            updateChosen();
        });
    </script>
</body>
</html>
