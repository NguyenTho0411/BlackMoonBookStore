<!-- Question Details Modal -->
<div class="modal-header" style="background: linear-gradient(135deg, #8E44AD 0%, #4A235A 100%); color: white; border-radius: 10px 10px 0 0; padding: 15px 20px;">
  <h4 class="modal-title">
    <i class="fas fa-question-circle me-2"></i> Question Details
  </h4>
  <button type="button" class="btn-close btn-close-white" data-dismiss="modal" aria-label="Close"></button>
</div>

<div class="modal-body py-4" style="background-color: #f9f5ff;">
  <!-- Question ID and Approval Status -->
  <div class="mb-4">
    <div class="d-flex align-items-center mb-2">
      <span class="badge" style="background-color: #512DA8; padding: 6px 12px; font-size: 0.9rem;">Question #<span th:text="${question.id}"></span></span>
      <span class="ms-3 text-muted">
        <i class="far fa-clock me-1"></i>
        <span th:text="${#dates.format(question.askTime, 'MMM dd, yyyy HH:mm')}"></span>
      </span>
    </div>
    
    <div class="mt-2">
      <th:block th:if="${question.approved == false}">
        <div class="alert alert-warning py-2 px-3" style="border-radius: 8px; background-color: rgba(255, 193, 7, 0.1); border-color: rgba(255, 193, 7, 0.2);">
          <i class="fas fa-exclamation-triangle me-2"></i>
          <span class="fw-bold">This question has not been approved yet</span>
        </div>
      </th:block>
      <th:block th:if="${question.approved == true}">
        <div class="alert alert-success py-2 px-3" style="border-radius: 8px; background-color: rgba(40, 167, 69, 0.1); border-color: rgba(40, 167, 69, 0.2);">
          <i class="fas fa-check-circle me-2"></i>
          <span class="fw-bold">This question has been approved</span>
        </div>
      </th:block>
    </div>
  </div>

  <!-- Book Info -->
  <div class="card mb-4 border-0 shadow-sm">
    <div class="card-header" style="background-color: rgba(81, 45, 168, 0.1); border: none;">
      <h5 class="mb-0" style="color: #512DA8;">
        <i class="fas fa-book me-2"></i> Book Information
      </h5>
    </div>
    <div class="card-body">
      <input type="text" readonly class="form-control bg-white" th:value="${question.book.name}" style="border-radius: 8px; border: 1px solid #e0d5f0;" />
    </div>
  </div>

  <!-- Question Content -->
  <div class="card mb-4 border-0 shadow-sm">
    <div class="card-header" style="background-color: rgba(81, 45, 168, 0.1); border: none;">
      <h5 class="mb-0" style="color: #512DA8;">
        <i class="fas fa-question me-2"></i> Question Content
      </h5>
    </div>
    <div class="card-body">
      <div class="mb-3">
        <label class="form-label fw-bold" style="color: #512DA8;">Question:</label>
        <div class="p-3 rounded" style="background-color: white; border: 1px solid #e0d5f0; min-height: 80px;">
          <p class="mb-0" th:text="${question.questionContent}"></p>
        </div>
      </div>
      
      <div class="mb-3">
        <div class="d-flex align-items-center">
          <label class="form-label me-3 mb-0 fw-bold" style="color: #512DA8; min-width: 70px;">Asked by:</label>
          <input type="text" readonly class="form-control bg-white" th:value="${question.asker.fullName}" 
                 style="border-radius: 8px; border: 1px solid #e0d5f0;" />
        </div>
      </div>
      
      <!-- Votes -->
      <div class="d-flex align-items-center mt-3">
        <div class="d-flex align-items-center">
          <i class="fas fa-thumbs-up me-2" style="color: #512DA8;"></i>
          <span class="fw-bold" style="color: #512DA8;">Votes:</span>
          <span class="badge ms-2" style="background-color: #512DA8;" th:text="${question.votes}"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Answer Section -->
  <div class="card mb-4 border-0 shadow-sm">
    <div class="card-header" style="background-color: rgba(81, 45, 168, 0.1); border: none;">
      <h5 class="mb-0" style="color: #512DA8;">
        <i class="fas fa-reply me-2"></i> Answer
      </h5>
    </div>
    <div class="card-body">
      <th:block th:if="${question.answered == true}">
        <div class="mb-3">
          <label class="form-label fw-bold" style="color: #512DA8;">Answer:</label>
          <div class="p-3 rounded" style="background-color: white; border: 1px solid #e0d5f0; min-height: 100px;">
            <p class="mb-0" th:text="${question.answer}"></p>
          </div>
        </div>
        
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-bold" style="color: #512DA8;">Answered by:</label>
            <input type="text" readonly class="form-control bg-white" th:value="${question.answerer.fullName}" 
                   style="border-radius: 8px; border: 1px solid #e0d5f0;" />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold" style="color: #512DA8;">Answer Time:</label>
            <input type="text" readonly class="form-control bg-white" 
                   th:value="${#dates.format(question.answerTime, 'MMM dd, yyyy HH:mm')}" 
                   style="border-radius: 8px; border: 1px solid #e0d5f0;" />
          </div>
        </div>
      </th:block>
      
      <th:block th:if="${question.answered == false}">
        <div class="alert alert-warning py-3 px-4 text-center" style="border-radius: 8px; background-color: rgba(255, 193, 7, 0.1); border-color: rgba(255, 193, 7, 0.2);">
          <i class="fas fa-exclamation-circle me-2"></i>
          <span class="fw-bold">This question has not been answered yet</span>
        </div>
      </th:block>
    </div>
  </div>
</div>

<div class="modal-footer" style="background-color: #f9f5ff; border-radius: 0 0 10px 10px; border-top: 1px solid #e0d5f0;">
  <button type="button" class="btn btn-danger" data-dismiss="modal" style="border-radius: 8px; padding: 8px 20px;">
    <i class="fas fa-times me-2"></i> Close
  </button>
</div>
