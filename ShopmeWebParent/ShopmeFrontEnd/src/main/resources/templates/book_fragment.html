<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

	<!-- Fragment hiển thị nội dung sách -->
	<div th:fragment="content" class="col-sm-2">
		<div>
			<a th:href="@{'/b/' + ${book.alias}}">
				<img th:src="@{${book.mainImagePath}}" width="150">
				<br />
				<b>[[${book.shortName}]]</b>
			</a>
		</div>

		<!-- Gọi fragment book_price và truyền book vào -->
		<div th:replace="~{book_fragment :: book_price(book=${book})}"></div>
	</div>

<!-- book_fragment.html -->
<div th:fragment="book_price(book)">
	<th:block th:if="${book.discountPrice == null or book.discountPrice == 0}">
		<div th:replace="~{book_fragment :: price_fragment(bookPrice=${book.price})}"></div>
	</th:block>
	<th:block th:if="${book.discountPrice != null and book.discountPrice > 0}">
		<span style="font-size: larger; color: darkred">
			<div th:replace="~{book_fragment :: price_fragment(bookPrice=${book.discountPrice})}"></div>
		</span>
		<del>
			<span>
				<div th:replace="~{book_fragment :: price_fragment(bookPrice=${book.price})}"></div>
			</span>
		</del>
	</th:block>
</div>

<div th:fragment="price_fragment(bookPrice)">
	<span th:if="${CURRENCY_SYMBOL_POSITION == 'Before price'}" th:remove="tag">
		[[${CURRENCY_SYMBOL}]]
	</span>
	[[${#numbers.formatDecimal(bookPrice, 1, THOUSANDS_POINT_TYPE, DECIMAL_DIGITS, DECIMAL_POINT_TYPE)}]]
	<span th:if="${CURRENCY_SYMBOL_POSITION == 'After price'}" th:remove="tag">
		[[${CURRENCY_SYMBOL}]]
	</span>
</div>


</body>
</html>
